version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # rustls-acme 0.15.x implements the axum-server 0.8 Accept trait.
      # Remove this restriction when rustls-acme supports axum-server 0.9+.
      - dependency-name: "axum-server"
        versions: [">=0.9"]
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
