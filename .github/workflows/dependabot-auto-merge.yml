name: Dependabot Auto-Merge Bot

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor updates when available
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          AUTO_MERGE_ENABLED=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')
          if [[ "$AUTO_MERGE_ENABLED" == "true" ]]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Repository auto-merge is disabled; leaving this PR open for normal check and review gating."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
