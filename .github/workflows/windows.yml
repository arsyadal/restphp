name: Windows Build & Smoke

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / PHP ${{ matrix.php }} (NTS)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install matching PHP NTS runtime and development pack
        shell: pwsh
        run: ./scripts/setup-windows-php.ps1 -PhpVersion '${{ matrix.php }}' -InstallDir "$env:RUNNER_TEMP\restphp-php"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings
      - name: Build runtime
        run: cargo build
      - name: Run native Rust and HTTP regressions
        run: cargo test -- --test-threads=1
      - name: Exercise release executable
        if: matrix.php == '8.4'
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/restphp.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = ./target/release/restphp.exe -e "echo PHP_OS_FAMILY, ':', PHP_VERSION;"
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'Windows:8\.4\.') {
            throw "Native PHP evaluation failed: $output"
          }
      - name: Package executable with matching PHP DLLs
        if: matrix.php == '8.4'
        shell: pwsh
        run: |
          Copy-Item ./target/release/restphp.exe "$env:RESTPHP_PHP_RUNTIME\restphp.exe"
          Copy-Item LICENSE, LICENSE-MIT, LICENSE-APACHE -Destination $env:RESTPHP_PHP_RUNTIME
          Copy-Item docs/guide/windows.md "$env:RESTPHP_PHP_RUNTIME\RESTPHP-WINDOWS.md"
          Compress-Archive "$env:RESTPHP_PHP_RUNTIME\*" restphp-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: restphp-windows-x86_64
          path: restphp-windows-x86_64.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: restphp-windows-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: restphp-windows-x86_64.zip
