name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Branch rules require Build & Test even when only documentation changes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          : "${BASE_SHA:?Missing base commit}"
          : "${HEAD_SHA:?Missing head commit}"
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'backend=true\ndocs=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          range="$BASE_SHA..$HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$BASE_SHA...$HEAD_SHA"
          fi
          git diff --no-renames --name-only -z "$range" > "$RUNNER_TEMP/ci-changed-paths"
          backend=false
          docs=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|.github/workflows/deploy-docs.yml) docs=true ;;
              .github/workflows/ci.yml) backend=true; docs=true ;;
              */*) backend=true ;;
              *.md) ;;
              *) backend=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changed-paths"
          printf 'backend=%s\ndocs=%s\n' "$backend" "$docs" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run docs:build

  rust:
    name: Rust / PHP ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-embed
        with:
          php-version: ${{ matrix.php }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -- -D warnings
      - name: Build RestPHP
        run: cargo build --verbose
      - name: Run Rust regressions
        # The NTS embed VM is process-global: serialize test cases.
        run: cargo test --verbose -- --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: restphp-php${{ matrix.php }}
          path: target/debug/restphp
          if-no-files-found: error
      - name: Run benchmark parser and process regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  laravel:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} / Octane 2
    needs: [changes, rust]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 supports PHP 8.1-8.3; Laravel 11/12 support 8.2-8.4.
          - {php: "8.2", laravel: "10"}
          - {php: "8.2", laravel: "11"}
          - {php: "8.2", laravel: "12"}
          - {php: "8.3", laravel: "10"}
          - {php: "8.3", laravel: "11"}
          - {php: "8.3", laravel: "12"}
          - {php: "8.4", laravel: "11"}
          - {php: "8.4", laravel: "12"}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-embed
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/download-artifact@v4
        with:
          name: restphp-php${{ matrix.php }}
          path: target/debug
      - run: chmod +x target/debug/restphp
      - name: Exercise genuine Laravel application and supervisor
        run: >-
          python3 tests/run_laravel_integration.py
          --laravel '${{ matrix.laravel }}'
          --binary target/debug/restphp
          --output 'laravel-${{ matrix.laravel }}-php${{ matrix.php }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-${{ matrix.laravel }}-php${{ matrix.php }}-results
          path: laravel-${{ matrix.laravel }}-php${{ matrix.php }}.json
          if-no-files-found: warn

  test:
    name: Build & Test
    if: always()
    needs: [changes, docs, rust, laravel]
    runs-on: ubuntu-24.04
    steps:
      - name: Require applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          LARAVEL_RESULT: ${{ needs.laravel.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$BACKEND_CHANGED" = true ]; then
            test "$RUST_RESULT" = success
            test "$LARAVEL_RESULT" = success
          fi
          if [ "$DOCS_CHANGED" = true ]; then
            test "$DOCS_RESULT" = success
          fi
