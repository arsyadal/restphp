name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev php-dev libphp-embed

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy -- -D warnings

      - name: Build RestPHP
        run: cargo build --verbose

      - name: Run Tests
        # Zend's embed SAPI owns process-global state, so Rust test binaries must
        # not exercise it from parallel test threads.
        run: cargo test --verbose -- --test-threads=1
