<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="restphp_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield / Hexagon -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#0f172a" stroke="url(#restphp_grad)" stroke-width="4"/>
  <!-- Rust Gear Motif -->
  <circle cx="50" cy="50" r="28" stroke="#f97316" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Lightning / Fast R Letter -->
  <path d="M40 32 L58 32 C65 32 68 36 68 42 C68 47 64 51 58 51 L47 51 L47 68 M47 51 L62 68" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Bolt Accent -->
  <polygon points="52,24 44,40 50,40 46,56 60,38 52,38" fill="#facc15"/>
</svg>
